<title>StockSense Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EEF1F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#16212A; --ink-2:#4A5863; --ink-3:#7D8A93; --line:#D9DFDD;
  --accent:#0F6B64; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB;
  --side:#15232B; --side-ink:#C3CFD4; --side-dim:#7F9098; --side-active:#22363F; --side-line:#24343C; --side-strong:#FFFFFF;
  --draft-fg:#5B6770; --draft-bg:#E7EBEA; --wait-fg:#8A5A00; --wait-bg:#FFEFC2; --ready-fg:#1D5FA8; --ready-bg:#DFEBFA;
  --done-fg:#1E7B45; --done-bg:#DDF2E4; --cancel-fg:#B42318; --cancel-bg:#FDE3E0;
  --pos:#1E7B45; --neg:#B42318; --shadow:0 1px 2px rgba(20,33,42,.06),0 4px 16px rgba(20,33,42,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1519; --surface:#172026; --surface-2:#1C272E; --ink:#E6ECEE; --ink-2:#A9B6BC; --ink-3:#7B8990; --line:#2A363D;
    --accent:#3DB5A8; --accent-ink:#06201D; --accent-soft:#16332F;
    --side:#0B1115; --side-ink:#C3CFD4; --side-dim:#6E7E86; --side-active:#1A262C; --side-line:#1B252B;
    --draft-fg:#A8B3B9; --draft-bg:#262F35; --wait-fg:#F2C14E; --wait-bg:#3A2E0E; --ready-fg:#7DB4F0; --ready-bg:#13283F;
    --done-fg:#6FD39A; --done-bg:#12301E; --cancel-fg:#F4877C; --cancel-bg:#3B1714; --pos:#6FD39A; --neg:#F4877C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1519; --surface:#172026; --surface-2:#1C272E; --ink:#E6ECEE; --ink-2:#A9B6BC; --ink-3:#7B8990; --line:#2A363D;
  --accent:#3DB5A8; --accent-ink:#06201D; --accent-soft:#16332F;
  --side:#0B1115; --side-ink:#C3CFD4; --side-dim:#6E7E86; --side-active:#1A262C; --side-line:#1B252B;
  --draft-fg:#A8B3B9; --draft-bg:#262F35; --wait-fg:#F2C14E; --wait-bg:#3A2E0E; --ready-fg:#7DB4F0; --ready-bg:#13283F;
  --done-fg:#6FD39A; --done-bg:#12301E; --cancel-fg:#F4877C; --cancel-bg:#3B1714; --pos:#6FD39A; --neg:#F4877C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:15px}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;color:var(--side-strong);letter-spacing:.01em}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-dim);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);padding:8px 10px;border-radius:6px;text-align:left;font-size:13.5px}
.nav button:hover{background:var(--side-active)}
.nav button.active{background:var(--side-active);color:var(--side-strong);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .count{margin-left:auto;font-size:11px;background:var(--side-line);color:var(--side-ink);padding:1px 7px;border-radius:10px}
.profile{border-top:1px solid var(--side-line);padding:12px 8px 0;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.profile small{display:block;color:var(--side-dim);font-size:11.5px}
.profile .who{font-size:13px;color:var(--side-strong)}
.logout{margin-left:auto;background:none;border:0;color:var(--side-dim);padding:6px;border-radius:6px}
.logout:hover{color:var(--side-strong);background:var(--side-active)}
.theme-select{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:12.5px;max-width:170px}

/* Theme comparison */
.criteria{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.criteria b{color:var(--ink);font-weight:600}
.themes{display:flex;flex-direction:column;gap:14px}
.theme-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:56px 260px minmax(0,1fr);gap:0;overflow:hidden}
.theme-card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rank{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;color:var(--ink-3);border-right:1px solid var(--line);background:var(--surface-2)}
.theme-card:first-child .rank{color:var(--accent)}
.mini{display:grid;grid-template-columns:70px 1fr;min-height:150px;border-right:1px solid var(--line)}
.mini-side{padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.mini-side i{display:block;height:7px;border-radius:3px;opacity:.55}
.mini-side i.on{opacity:1;height:14px}
.mini-main{padding:10px;display:flex;flex-direction:column;gap:8px}
.mini-kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini-kpi{border-radius:4px;padding:6px;font-family:var(--display);font-weight:700;font-size:15px}
.mini-kpi small{display:block;font-family:var(--sans);font-weight:400;font-size:9px;opacity:.7}
.mini-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mini-btn{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px}
.mini-badge{font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:8px}
.theme-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.theme-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.theme-top h3{margin:0;font-family:var(--display);font-size:16px}
.theme-top .total{font-family:var(--display);font-weight:700;font-size:15px;margin-left:auto}
.theme-top .total small{color:var(--ink-3);font-weight:500;font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.sw i{width:18px;height:18px;border-radius:4px;border:1px solid var(--line);flex:none}
.scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.score{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-3)}
.pips{display:flex;gap:2px}
.pips i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.pips i.f{background:var(--ink-2)}
.pros{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px}
.pros ul{margin:0;padding-left:16px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.pros h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500}
@media (max-width:1000px){.theme-card{grid-template-columns:48px minmax(0,1fr)}.mini{grid-column:2;border-right:0;border-bottom:1px solid var(--line)}.theme-body{grid-column:2}.rank{grid-row:1/3}}
@media (max-width:560px){.scores{grid-template-columns:repeat(3,minmax(0,1fr))}.pros{grid-template-columns:1fr}.theme-select{display:none}}

/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px}
.crumbs{font-size:12px;color:var(--ink-3)}
.page-title{font-family:var(--display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:min(320px,40vw)}
.search input{border:0;background:none;outline:none;width:100%}
.search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.icon-btn{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px;display:grid;place-items:center}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--cancel-fg);color:#fff;font-size:10px;font-weight:600;border-radius:9px;padding:0 5px;line-height:16px}
.content{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
.mock-note{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.mock-note b{color:var(--ink-2);font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.kpi:hover{border-color:var(--accent)}
.kpi .k-label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .k-val{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.kpi .k-sub{font-size:12px;color:var(--ink-3)}
.kpi .k-sub b{font-weight:600}
.kpi.warn{border-top:3px solid var(--wait-fg);padding-top:12px}
.kpi .go{position:absolute;right:12px;top:12px;color:var(--ink-3);font-size:12px}

/* Panels */
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0}
.panel-head .spacer{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
select,.input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;min-width:0}
.input{width:100%}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--ink-2)}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.tab .n{color:var(--ink-3);font-weight:400;margin-left:4px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.muted{color:var(--ink-3)}
.route{color:var(--ink-2);font-size:12.5px}
.route .arr{color:var(--ink-3);margin:0 4px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;line-height:18px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-draft{color:var(--draft-fg);background:var(--draft-bg)}
.b-waiting{color:var(--wait-fg);background:var(--wait-bg)}
.b-ready{color:var(--ready-fg);background:var(--ready-bg)}
.b-done{color:var(--done-fg);background:var(--done-bg)}
.b-canceled{color:var(--cancel-fg);background:var(--cancel-bg)}
.type-chip{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink-2)}

/* Alerts */
.alert-list{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .a-name{font-weight:500}
.alert .a-sku{grid-column:1}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.alert .a-qty{text-align:right;font-weight:600}
.alert .a-min{font-size:11.5px;color:var(--ink-3);text-align:right}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:7px 13px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--cancel-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}

/* Detail */
.stepper{display:flex;gap:0;flex-wrap:wrap}
.step{font-size:12px;padding:5px 14px 5px 18px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);margin-left:-4px}
.step:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);margin-left:0;padding-left:12px}
.step.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:16px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.field div{font-weight:500}
.warn-text{color:var(--wait-fg);font-size:12px}

.diff-pos{color:var(--pos);font-weight:600}
.diff-neg{color:var(--neg);font-weight:600}

/* Settings */
.wh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.loc{display:flex;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px}
.loc:last-child{border-bottom:0}

/* Auth */
.auth{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px}
.auth-card h3{font-family:var(--display);margin:0;font-size:18px}
.auth-card p{margin:0;color:var(--ink-2);font-size:13px}
.otp{display:flex;gap:8px}
.otp input{width:42px;height:48px;text-align:center;font-family:var(--mono);font-size:20px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.link{color:var(--accent);background:none;border:0;padding:0;font-size:13px;text-align:left}
.steps-mini{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* Dialog & toast */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.5);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--surface);border-radius:10px;max-width:420px;width:100%;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-family:var(--display);font-size:17px}
.dialog p{margin:0;color:var(--ink-2)}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow)}

/* Responsive */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:grid}
  .top{padding:10px 16px}
  .content{padding:18px 16px 32px}
  .search{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){.kpis{grid-template-columns:1fr}.otp input{width:38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">S</div><div class="brand-name">StockSense</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="profile">
      <div class="avatar">RK</div>
      <div><div class="who">Riya Kapoor</div><small>Inventory Manager</small></div>
      <button class="logout" title="Log out" data-go="auth" aria-label="Log out"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div>
        <div class="crumbs" id="crumbs">Overview</div>
        <h1 class="page-title" id="title">Dashboard</h1>
      </div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="globalSearch" placeholder="Search SKU or product…" aria-label="Search SKU or product"></label>
      <button class="icon-btn" data-go="dashboard" title="Low stock alerts" aria-label="Low stock alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot" id="bellCount">3</span></button>
      <select class="theme-select" id="paletteSel" aria-label="Color theme"></select>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="layer"></div>

<script>
/* ---------- Sample data (mirrors database/schema in plan.md) ---------- */
const WAREHOUSES=[
  {id:1,name:"Main Warehouse",code:"WH",address:"Plot 14, Focal Point, Ludhiana",locations:["WH/Stock","WH/Rack A","WH/Rack B","WH/Production Floor"]},
  {id:2,name:"Warehouse 2",code:"WH2",address:"GT Road, Khanna",locations:["WH2/Stock","WH2/Dispatch Bay"]}
];

(function injectPalettes(){
  const decl=m=>Object.entries(m).map(([k,v])=>`--${k}:${v}`).join(";");
  let css="";
  PALETTES.forEach(p=>{if(!Object.keys(p.light).length)return;
    css+=`:root[data-palette="${p.id}"]{${decl(p.light)}}`;
    css+=`@media (prefers-color-scheme: dark){:root[data-palette="${p.id}"]:not([data-theme="light"]){${decl(p.dark)}}}`;
    css+=`:root[data-palette="${p.id}"][data-theme="dark"]{${decl(p.dark)}}`;
  });
  const s=document.createElement("style");s.textContent=css;document.head.appendChild(s);
})();
let currentPalette="green";
try{const saved=localStorage.getItem("ss-palette");if(PALETTES.some(p=>p.id===saved))currentPalette=saved}catch(e){}
function applyPalette(id){currentPalette=id;document.documentElement.setAttribute("data-palette",id);try{localStorage.setItem("ss-palette",id)}catch(e){}const sel=document.getElementById("paletteSel");if(sel)sel.value=id}

    <button class="kpi" data-go="transfers"><span class="k-label">Internal transfers scheduled</span><span class="k-val num">${pending("internal")}</span><span class="k-sub">WH/Stock → Production Floor</span><span class="go">↗</span></button>
  </section>
  <div class="grid-2">
    <section class="panel">
      <div class="panel-head"><h2>Operations</h2><span class="muted">${rows.length} of ${OPS.length}</span><span class="spacer"></span><button class="btn" id="clearF">Clear filters</button></div>
      <div class="filters">
        <label>Document type<select id="fType">${opt("","All types",d.type)}${Object.keys(TYPE_LABEL).map(k=>opt(k,TYPE_LABEL[k]+(k==="adjustment"?"s":"s"),d.type)).join("")}</select></label>
        <label>Status<select id="fStatus">${opt("","All statuses",d.status)}${STATUSES.map(s=>opt(s,cap(s),d.status)).join("")}</select></label>
        <label>Warehouse<select id="fWh">${opt("","All warehouses",d.wh)}${WAREHOUSES.map(w=>opt(w.code,w.name,d.wh)).join("")}</select></label>
        <label>Product category<select id="fCat">${opt("","All categories",d.cat)}${cats.map(c=>opt(c,c,d.cat)).join("")}</select></label>
      </div>
      ${opsTable(rows,true)}
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Low stock alerts</h2><span class="spacer"></span><span class="badge b-waiting">${alerts.length}</span></div>
      <div class="alert-list">${alerts.map(p=>{const q=onHand(p),pct=Math.min(100,q/p.min*100),col=q===0?"var(--cancel-fg)":"var(--wait-fg)";
        return `<div class="alert"><div class="a-name">${esc(p.name)}</div><div class="a-qty num" style="color:${col}">${fmt(q)} ${p.uom}</div><div class="a-sku mono muted">${p.sku}</div><div class="a-min">reorder at ${fmt(p.min)}</div><div class="bar"><i style="width:${Math.max(pct,2)}%;background:${col}"></i></div></div>`}).join("")}</div>
    </section>
  </div>`;
}

function opsTable(rows,showType){
  if(!rows.length) return `<div class="empty">No operations match these filters.</div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Reference</th>${showType?"<th>Type</th>":""}<th>Partner</th><th>From → To</th><th>Scheduled</th><th>Status</th></tr></thead><tbody>
  ${rows.map(o=>`<tr class="click" data-op="${o.ref}"><td class="mono">${o.ref}</td>${showType?`<td><span class="type-chip">${TYPE_LABEL[o.type]}</span></td>`:""}<td>${esc(o.partner)}</td><td>${route(o.from,o.to)}</td><td class="num">${new Date(o.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</td><td>${badge(o.status)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function vOps(type){
  const titles={receipt:["Operations","Receipts","New receipt","Goods arriving from vendors. Validating adds the quantities to stock."],delivery:["Operations","Delivery Orders","New delivery","Goods leaving for customers. Validating removes the quantities from stock."],internal:["Operations","Internal Transfers","New transfer","Stock moving between locations. Total stock stays the same."],adjustment:["Operations","Inventory Adjustment","New count","Fix differences between recorded stock and a physical count."]}[type];
  setHead(titles[0],titles[1]);
  const all=OPS.filter(o=>o.type===type);
  const rows=state.opsTab==="all"?all:all.filter(o=>o.status===state.opsTab);
  const tabs=["all",...STATUSES].map(s=>`<button class="tab ${state.opsTab===s?"active":""}" data-tab="${s}">${s==="all"?"All":cap(s)}<span class="n">${s==="all"?all.length:all.filter(o=>o.status===s).length}</span></button>`).join("");
  let extra="";
  if(type==="adjustment"){
    extra=`<section class="panel"><div class="panel-head"><h2>Quick count</h2><span class="muted">Select a location and product, enter what you counted</span></div>
    <div class="fields">
      <label class="field"><span>Location</span><select id="adjLoc">${WAREHOUSES.flatMap(w=>w.locations).map(l=>`<option ${l==="WH/Stock"?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="field"><span>Product</span><select id="adjProd">${PRODUCTS.map(p=>`<option value="${p.sku}" ${p.sku==="PNT-GRY-5L"?"selected":""}>${p.sku} · ${esc(p.name)}</option>`).join("")}</select></label>
      <div class="field"><span>Recorded</span><div class="num" id="adjRec"></div></div>
      <label class="field"><span>Counted</span><input class="input num" id="adjCount" type="number" min="0" value="7"></label>
      <div class="field"><span>Difference</span><div class="num" id="adjDiff"></div></div>
      <div class="field" style="justify-content:flex-end"><button class="btn primary" id="adjApply">Apply adjustment</button></div>
    </div></section>`;
  }
  return `${note}<p class="muted" style="margin:0">${titles[3]}</p>${extra}
  <section class="panel"><div class="panel-head"><div class="tabs">${tabs}</div><span class="spacer"></span><button class="btn primary" id="newOp">+ ${titles[2]}</button></div>${opsTable(rows,false)}</section>`;
}

function vDetail(o){
  setHead(TYPE_LABEL[o.type]+(o.type==="internal"?" transfer":""),o.ref);
  const flow=o.type==="delivery"?["draft","waiting","ready","done"]:["draft","waiting","ready","done"];
  const idx=flow.indexOf(o.status);
  const stepNames=o.type==="delivery"?{draft:"Draft",waiting:"Waiting",ready:"Picked & packed",done:"Done"}:{draft:"Draft",waiting:"Waiting",ready:"Ready",done:"Done"};
  const editable=!["done","canceled"].includes(o.status);
  const sign=o.type==="receipt"?"+":o.type==="internal"?"":"−";
  const lines=o.lines.map(([sku,q])=>{const p=prod(sku);const avail=o.from.startsWith("WH")?(p.stock[o.from]||0):null;const short=avail!==null&&o.type!=="receipt"&&o.type!=="adjustment"&&avail<q&&editable;
    return `<tr><td class="mono">${sku}</td><td>${esc(p.name)}</td><td class="r num">${avail===null?'<span class="muted">—</span>':fmt(avail)+" "+p.uom}</td><td class="r num"><b>${fmt(q)}</b> ${p.uom}${short?`<div class="warn-text">Only ${fmt(avail)} available at ${o.from}</div>`:""}</td><td class="r num ${sign==="+"?"diff-pos":sign==="−"?"diff-neg":""}">${sign}${fmt(q)}</td></tr>`}).join("");
  const blocked=o.lines.some(([sku,q])=>{const p=prod(sku);return o.type!=="receipt"&&o.type!=="adjustment"&&(p.stock[o.from]||0)<q});
  let actions="";
  if(o.status==="draft") actions=`<button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="waiting">Mark as waiting</button>`;
  else if(o.status==="waiting") actions=`<button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="ready">${o.type==="delivery"?"Mark picked & packed":"Mark ready"}</button>`;
  else if(o.status==="ready") actions=`<button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="validate" ${blocked?"disabled title='Not enough stock at source location'":""}>Validate</button>`;
  return `${note}
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" data-go="${TYPE_PAGE[o.type]}">← Back</button><span class="spacer" style="flex:1"></span>${o.status==="canceled"?badge("canceled"):`<div class="stepper">${flow.map((s,i)=>`<span class="step ${i<=idx?"on":""}">${stepNames[s]}</span>`).join("")}</div>`}</div>
  <section class="panel">
    <div class="panel-head"><h2 class="mono" style="font-size:16px">${o.ref}</h2>${badge(o.status)}<span class="spacer"></span>${actions}</div>
    <div class="fields">
      <div class="field"><span>${o.type==="receipt"?"Supplier":o.type==="delivery"?"Customer":"Reason"}</span><div>${esc(o.partner==="—"?"Stock rebalancing":o.partner)}</div></div>
      <div class="field"><span>Source location</span><div>${esc(o.from)}</div></div>
      <div class="field"><span>Destination location</span><div>${esc(o.to)}</div></div>
      <div class="field"><span>Scheduled date</span><div class="num">${new Date(o.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</div></div>
    </div>
  </section>
  <section class="panel"><div class="panel-head"><h2>Products</h2><span class="spacer"></span>${editable?'<button class="btn">+ Add product</button>':""}</div>
    <div class="table-wrap"><table><thead><tr><th>SKU</th><th>Product</th><th class="r">Available at source</th><th class="r">Quantity</th><th class="r">Stock effect</th></tr></thead><tbody>${lines}</tbody></table></div>
  </section>
  ${o.status==="done"?`<p class="muted" style="margin:0">Validated. Stock moves for this document appear in <button class="link" data-go="moves">Move History</button>.</p>`:""}`;
}

/* ---------- Render ---------- */
function render(){
  renderNav();
  const v=document.getElementById("view");
  const p=state.page;
  if(state.detail) v.innerHTML=vDetail(state.detail);
  else if(p==="dashboard") v.innerHTML=vDashboard();
  else if(p==="products") v.innerHTML=vProducts();
  else if(p==="receipts") v.innerHTML=vOps("receipt");
  else if(p==="deliveries") v.innerHTML=vOps("delivery");
  else if(p==="transfers") v.innerHTML=vOps("internal");
  else if(p==="adjustments"){v.innerHTML=vOps("adjustment");updAdj()}
  else if(p==="moves") v.innerHTML=vMoves();
  else if(p==="warehouses") v.innerHTML=vWarehouses();
  else if(p==="auth") v.innerHTML=vAuth();
  else if(p==="themes") v.innerHTML=vThemes();
  const alerts=PRODUCTS.filter(x=>stockState(x)!=="ok").length;document.getElementById("bellCount").textContent=alerts;
}
function updAdj(){
  const l=document.getElementById("adjLoc"),pr=document.getElementById("adjProd"),c=document.getElementById("adjCount");if(!l)return;
  const p=prod(pr.value),rec=p.stock[l.value]||0,cnt=Number(c.value||0),d=cnt-rec;
  document.getElementById("adjRec").textContent=fmt(rec)+" "+p.uom;
  const el=document.getElementById("adjDiff");el.textContent=(d>0?"+":d<0?"−":"")+fmt(Math.abs(d))+" "+p.uom;el.className="num "+(d>0?"diff-pos":d<0?"diff-neg":"");
}

/* ---------- Dialog & toast ---------- */
function confirmBox(title,body,okLabel,onOk){
  const L=document.getElementById("layer");
  L.innerHTML=`<div class="scrim"><div class="dialog" role="dialog" aria-modal="true"><h3>${title}</h3><p>${body}</p><div class="actions"><button class="btn" id="dNo">Go back</button><button class="btn primary" id="dYes">${okLabel}</button></div></div></div>`;
  document.getElementById("dNo").onclick=()=>L.innerHTML="";
  document.getElementById("dYes").onclick=()=>{L.innerHTML="";onOk()};
  document.getElementById("dYes").focus();
}
let tt;function toast(msg){const L=document.createElement("div");L.className="toast";L.textContent=msg;document.body.appendChild(L);clearTimeout(tt);tt=setTimeout(()=>L.remove(),3200)}

function doAction(o,act){
  if(act==="cancel") return confirmBox(`Cancel ${o.ref}?`,"The document will be closed. Stock is not affected.","Cancel document",()=>{o.status="canceled";toast(o.ref+" canceled");render()});
  if(act==="waiting"||act==="ready"){o.status=act;toast(`${o.ref} is now ${act==="ready"&&o.type==="delivery"?"picked & packed":act}`);return render()}
  if(act==="validate"){
    const summary=o.lines.map(([s,q])=>`${o.type==="receipt"?"+":o.type==="internal"?"":"−"}${fmt(q)} ${prod(s).uom} ${prod(s).name}`).join(", ");
    confirmBox(`Validate ${o.ref}?`,`This updates stock right away: ${summary}${o.type==="internal"?` (from ${o.from} to ${o.to})`:""}.`,"Validate",()=>{
      const now="2026-09-26 "+new Date().toTimeString().slice(0,5);
      o.lines.forEach(([s,q])=>{const p=prod(s);
        if(o.type==="receipt"){p.stock[o.to]=(p.stock[o.to]||0)+q;MOVES.unshift({at:now,ref:o.ref,sku:s,from:o.from,to:o.to,qty:q,user:"Riya K."})}
        else if(o.type==="delivery"){p.stock[o.from]-=q;if(!p.stock[o.from])delete p.stock[o.from];MOVES.unshift({at:now,ref:o.ref,sku:s,from:o.from,to:o.to,qty:-q,user:"Riya K."})}
        else if(o.type==="internal"){p.stock[o.from]-=q;if(!p.stock[o.from])delete p.stock[o.from];p.stock[o.to]=(p.stock[o.to]||0)+q;MOVES.unshift({at:now,ref:o.ref,sku:s,from:o.from,to:o.to,qty:0,moved:q,user:"Riya K."})}
      });
      o.status="done";toast(`${o.ref} validated. Stock updated.`);render();
    });
  }
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){if(g.dataset.stockfilter){state.prodCat="__alert";state.prodQ=""}else if(g.dataset.go==="products"&&!state.detail&&state.page==="dashboard"){state.prodCat=""}go(g.dataset.go);return}
  const r=e.target.closest("[data-op]");if(r){go(state.page,OPS.find(o=>o.ref===r.dataset.op));return}
  const pb=e.target.closest("[data-palette]");if(pb&&pb.tagName==="BUTTON"){applyPalette(pb.dataset.palette);toast(PALETTES.find(x=>x.id===pb.dataset.palette).name+" applied");render();return}
  const t=e.target.closest("[data-tab]");if(t){state.opsTab=t.dataset.tab;render();return}
  const a=e.target.closest("[data-act]");if(a&&state.detail){doAction(state.detail,a.dataset.act);return}
  if(e.target.id==="clearF"){state.dash={type:"",status:"",wh:"",cat:""};render()}
  if(e.target.id==="adjApply"){const l=document.getElementById("adjLoc").value,p=prod(document.getElementById("adjProd").value),c=Number(document.getElementById("adjCount").value||0),rec=p.stock[l]||0,d=c-rec;
    if(d===0){toast("Counted quantity matches the record. Nothing to adjust.");return}
    confirmBox("Apply adjustment?",`${p.name} at ${l} changes from ${fmt(rec)} to ${fmt(c)} ${p.uom} (${d>0?"+":"−"}${fmt(Math.abs(d))}). A ledger entry will be written.`,"Apply",()=>{
      if(c)p.stock[l]=c;else delete p.stock[l];
      const n=OPS.filter(o=>o.type==="adjustment").length+1,ref="WH/ADJ/"+String(n+1).padStart(4,"0");
      OPS.unshift({ref,type:"adjustment",partner:"Physical count",from:l,to:"Inventory Loss",date:"2026-09-26",status:"done",wh:l.split("/")[0],lines:[[p.sku,Math.abs(d)]]});
      MOVES.unshift({at:"2026-09-26 "+new Date().toTimeString().slice(0,5),ref,sku:p.sku,from:d<0?l:"Inventory Loss",to:d<0?"Inventory Loss":l,qty:d,user:"Riya K."});
      toast(ref+" applied. Stock updated.");render();
    })}
  if(e.target.id==="newOp"||e.target.id==="newProd") toast("In the app this opens the create form.");
  if(e.target.id==="csv") toast("In the app this downloads the filtered ledger as CSV.");
  if(e.target.closest("#menuBtn")) document.getElementById("side").classList.toggle("open");
});
document.addEventListener("change",e=>{
  if(e.target.id==="paletteSel"){applyPalette(e.target.value);render();return}
  const m={fType:"type",fStatus:"status",fWh:"wh",fCat:"cat"}[e.target.id];
  if(m){state.dash[m]=e.target.value;render()}
  if(e.target.id==="prodCat"){state.prodCat=e.target.value;render()}
  if(["adjLoc","adjProd"].includes(e.target.id)) updAdj();
});
document.addEventListener("input",e=>{
  if(e.target.id==="adjCount") updAdj();
  if(e.target.id==="prodQ"||e.target.id==="moveQ"){const k=e.target.id==="prodQ"?"prodQ":"moveQ";state[k]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(e.target.id);el.focus();el.setSelectionRange(pos,pos)}
});
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){state.prodQ=e.target.value;state.prodCat="";go("products")}});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const r=document.documentElement,cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
});
const start=(location.hash||"").slice(1);
if(NAV.some(n=>n.id===start)) state.page=start;
render();
</script>
